# PaperHid pointer — touch-click (no pen/marker injection)
accel=2.0
touch_x_max=2064
touch_y_max=2832
display_w=1620
display_h=2160
invert_x=0
invert_y=0
swap_xy=0
scroll_as_swipe=1
# 0 = only click buttons tap (recommended with keyboard+pad)
# 1 = finger-on-pad also holds touch (drag by resting finger)
finger_drag=0
# cursor=1 publishes to the version-gated XOVI QML overlay.
# Keep off until `paperpointer enable-cursor` passes its live health check.
cursor=0
# XOVI's FIFO is a control channel, so movement is latest-wins and rate-limited.
cursor_hz=30
# Compensate for the panel update trailing FIFO delivery during fast motion.
# 0 disables compensation; accepted range is 0-250 milliseconds.
cursor_lag_ms=50
# Auto-hide the crosshair after this many idle milliseconds while a pointer is
# still connected. 0 (default) keeps it painted until disconnect; max 600000.
# cursor_hide_ms=3000
# Cursor skin: cross (geometry) or win95 (PNG under ~/.paperpointer/cursors/).
cursor_style=cross
# UI rotation for synthetic touch only. Cursor coordinates stay upright-logical.
# auto = read ~/.paperpointer/ui_orientation from the QML overlay.
# Force 0/90/180/270 to diagnose mapping without auto-detection.
orientation=auto
# source=/dev/input/event7
